{% if page.mermaid != false %}
    <script src="mermaid.full.min.js"></script>
    <script>
    $(document).ready(function () {
        mermaid.initialize({
        startOnLoad:true,
        theme: "default",
        });
        window.mermaid.init(undefined, document.querySelectorAll('.language-mermaid'));
    });
    </script>
{% endif %}
